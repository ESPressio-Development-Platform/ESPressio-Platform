name: OTA Trial State Recovery Fix

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Patch portable OTA trial-state inspection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/ESPressio_PlatformOTA.hpp')
          s = p.read_text()
          old = '''struct Result final {
              Status Code{Status::Failed};
              std::int32_t NativeCode{0};
              constexpr explicit operator bool() const noexcept { return Code == Status::Success; }
          };
          '''
          new = old + '''
          enum class TrialBootState : std::uint8_t {
              Unknown,
              Untracked,
              NeverAttempted,
              Armed,
              PendingValidation,
              Accepted,
              Rejected
          };

          struct TrialBootStateResult final {
              Status Code{Status::Failed};
              TrialBootState State{TrialBootState::Unknown};
              std::int32_t NativeCode{0};
              constexpr explicit operator bool() const noexcept { return Code == Status::Success; }
          };
          '''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          marker = '''template <typename T, typename = void>
          struct IsSystemRestartProvider : std::false_type {};
          '''
          insert = '''template <typename T, typename = void>
          struct HasTrialBootStateInspection : std::false_type {};

          template <typename T>
          struct HasTrialBootStateInspection<T, std::void_t<
              decltype(std::declval<const T&>().InspectBootTargetTrialState(BootTargetIdentifier{}))>>
              : std::bool_constant<
                    IsProviderV<T> &&
                    T::PlatformCapabilities::template Contains<Capability::TrialBoot> &&
                    std::is_same_v<decltype(std::declval<const T&>().InspectBootTargetTrialState(BootTargetIdentifier{})), TrialBootStateResult> &&
                    noexcept(std::declval<const T&>().InspectBootTargetTrialState(BootTargetIdentifier{}))> {};

          ''' + marker
          assert s.count(marker) == 1
          s = s.replace(marker, insert, 1)

          marker = '''template <typename T> inline constexpr bool IsTrialBootProviderV = Detail::IsTrialBootProvider<T>::value;
          '''
          replacement = marker + '''template <typename T> inline constexpr bool HasTrialBootStateInspectionV = Detail::HasTrialBootStateInspection<T>::value;
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          p = Path('tests/native/platform_ota_contract_test.cpp')
          s = p.read_text()
          marker = '''    bool IsCurrentBootTrial() const noexcept { return trial; }
          '''
          replacement = marker + '''    OTA::TrialBootStateResult InspectBootTargetTrialState(OTA::BootTargetIdentifier target) const noexcept {
              return target
                  ? OTA::TrialBootStateResult{OTA::Status::Success, OTA::TrialBootState::NeverAttempted, 0}
                  : OTA::TrialBootStateResult{OTA::Status::Invalid, OTA::TrialBootState::Unknown, 0};
          }
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)
          marker = '''static_assert(OTA::IsTrialBootProviderV<OTAProvider>);
          '''
          replacement = marker + '''static_assert(OTA::HasTrialBootStateInspectionV<OTAProvider>);
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ESPressio_PlatformOTA.hpp tests/native/platform_ota_contract_test.cpp
          git commit -m "feat: expose optional OTA trial-state inspection"
          git push origin HEAD:ota_v1